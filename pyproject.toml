[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "conference-recorder"
version = "2.0.0"
description = "Portable full-screen and Chrome process-audio recorder for Windows"
requires-python = ">=3.11"

[project.scripts]
conference-recorder = "bizneo_recorder.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

