[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "conference-recorder"
version = "2.1.0"
description = "Portable selectable screen and Chrome-tab recorder for Windows"
requires-python = ">=3.11"

[project.scripts]
conference-recorder = "bizneo_recorder.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bizneo_recorder = ["assets/*.html"]

