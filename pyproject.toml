[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bizneo-recorder"
version = "1.0.0"
description = "Portable Windows screen and microphone recorder"
requires-python = ">=3.11"

[project.scripts]
bizneo-recorder = "bizneo_recorder.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

