<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elegir fuente · Grabador de conferencias</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
      --background: #0b0c10;
      --surface: #151720;
      --surface-raised: #1b1e29;
      --border: #2a2e3a;
      --text: #f7f7fa;
      --muted: #9ca3b5;
      --coral: #ff5a5f;
      --violet: #8b5cf6;
      --green: #55e6a5;
      --amber: #f6b94a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgb(139 92 246 / 10%), transparent 32%),
        radial-gradient(circle at 85% 82%, rgb(255 90 95 / 9%), transparent 34%),
        var(--background);
      color: var(--text);
    }
    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      opacity: .18;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.15'/%3E%3C/svg%3E");
    }
    main {
      position: relative;
      width: min(560px, calc(100vw - 32px));
      padding: 24px 28px 28px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgb(21 23 32 / 94%);
      box-shadow: 0 28px 80px rgb(0 0 0 / 42%);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 650;
    }
    .brand-mark {
      position: relative;
      width: 30px;
      height: 30px;
      border: 2px solid var(--coral);
      border-radius: 50%;
    }
    .brand-mark::after {
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background: var(--coral);
      content: "";
    }
    .local-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
    }
    .local-badge::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgb(85 230 165 / 55%);
      content: "";
    }
    .hero { text-align: center; }
    .eyebrow {
      margin: 0 0 4px;
      color: var(--coral);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
    }
    h1 {
      margin: 0;
      font-size: clamp(27px, 6vw, 38px);
      line-height: 1.12;
      letter-spacing: -.035em;
    }
    #instructions {
      max-width: 440px;
      margin: 8px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .visual {
      position: relative;
      width: 360px;
      max-width: 100%;
      height: 156px;
      margin: 4px auto;
    }
    .core,
    .ring,
    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }
    .core {
      z-index: 3;
      width: 38px;
      height: 38px;
      background: var(--coral);
      box-shadow: 0 0 38px rgb(255 90 95 / 38%);
      animation: breathe 2.8s ease-in-out infinite;
    }
    .ring {
      z-index: 2;
      width: 94px;
      height: 94px;
      border: 2px solid var(--coral);
      box-shadow: inset 0 0 24px rgb(255 90 95 / 10%), 0 0 24px rgb(255 90 95 / 12%);
    }
    .orbit {
      width: 330px;
      height: 74px;
      border: 2px solid rgb(255 90 95 / 52%);
      transform: translate(-50%, -50%) rotate(-9deg);
      animation: orbit 8s linear infinite;
    }
    .orbit.secondary {
      width: 280px;
      height: 104px;
      border-color: rgb(139 92 246 / 55%);
      transform: translate(-50%, -50%) rotate(11deg);
      animation-duration: 11s;
      animation-direction: reverse;
    }
    .orbit::after {
      position: absolute;
      top: 50%;
      right: -5px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 0 0 15px currentColor;
      content: "";
    }
    .orbit.secondary::after { background: var(--violet); }
    .tip {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin: 0 0 14px;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-raised);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: left;
    }
    .tip-mark {
      display: grid;
      flex: 0 0 auto;
      width: 25px;
      height: 25px;
      place-items: center;
      border-radius: 8px;
      background: rgb(139 92 246 / 16%);
      color: #bca7ff;
      font-weight: 700;
    }
    button {
      width: 100%;
      min-height: 54px;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 15px;
      background: var(--coral);
      box-shadow: 0 12px 30px rgb(255 90 95 / 22%);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
    }
    button:hover {
      filter: brightness(1.06);
      box-shadow: 0 14px 34px rgb(255 90 95 / 30%);
      transform: translateY(-1px);
    }
    button:active { transform: translateY(1px) scale(.995); }
    button:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }
    button:disabled { cursor: wait; filter: saturate(.45); opacity: .68; transform: none; }
    #status {
      min-height: 42px;
      margin: 12px 0 0;
      padding: 10px 12px;
      border-radius: 11px;
      background: rgb(255 255 255 / 4%);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }
    #status.error { background: rgb(255 90 95 / 10%); color: #ff9ca0; }
    #status.success { background: rgb(85 230 165 / 9%); color: var(--green); }
    @keyframes orbit {
      from { transform: translate(-50%, -50%) rotate(-9deg); }
      to { transform: translate(-50%, -50%) rotate(351deg); }
    }
    @keyframes breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(.94); }
      50% { transform: translate(-50%, -50%) scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Grabador de conferencias</div>
      <div class="local-badge">Conexión local</div>
    </header>
    <section class="hero">
      <p class="eyebrow">ÚLTIMO PASO</p>
      <h1 id="title">Seleccionar fuente</h1>
      <p id="instructions"></p>
      <div class="visual" aria-hidden="true">
        <div class="orbit"></div>
        <div class="orbit secondary"></div>
        <div class="ring"></div>
        <div class="core"></div>
      </div>
    </section>
    <div class="tip"><span class="tip-mark">i</span><span id="tip-text"></span></div>
    <button id="select" type="button">Seleccionar</button>
    <div id="status" role="status" aria-live="polite">Todo preparado para seleccionar.</div>
  </main>
  <script>
    "use strict";

    const config = __CAPTURE_CONFIG__;
    const apiBase = `/api/${config.token}`;
    const modeIsTab = config.mode === "tab";
    const title = document.querySelector("#title");
    const instructions = document.querySelector("#instructions");
    const tipText = document.querySelector("#tip-text");
    const selectButton = document.querySelector("#select");
    const statusBox = document.querySelector("#status");

    let stream = null;
    let recorder = null;
    let audioContext = null;
    let sequence = 0;
    let uploadChain = Promise.resolve();
    let stopping = false;

    class RetryableSelectionError extends Error {}

    title.textContent = modeIsTab ? "Seleccionar pestaña" : "Seleccionar pantalla";
    selectButton.textContent = modeIsTab ? "Elegir pestaña en Chrome" : "Elegir pantalla en Chrome";
    instructions.textContent = modeIsTab
      ? "Chrome te mostrará las pestañas abiertas. Elige la conferencia que quieres grabar."
      : "Chrome te mostrará tus pantallas. Elige el monitor completo que quieres grabar.";
    tipText.textContent = modeIsTab
      ? "En el selector, entra en Pestaña de Chrome y activa Compartir también el audio."
      : "En el selector, entra en Pantalla completa. No elijas una ventana ni una pestaña.";

    function setStatus(message, kind = "") {
      statusBox.textContent = message;
      statusBox.className = kind;
    }

    function stopTracks() {
      if (stream) {
        for (const track of stream.getTracks()) track.stop();
      }
      if (audioContext) audioContext.close().catch(() => {});
    }

    async function responseError(response) {
      try {
        const payload = await response.json();
        return payload.error || `Error local ${response.status}`;
      } catch (_) {
        return `Error local ${response.status}`;
      }
    }

    async function postJson(action, payload = {}) {
      const response = await fetch(`${apiBase}/${action}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        cache: "no-store",
      });
      if (!response.ok) throw new Error(await responseError(response));
    }

    async function postChunk(blob, currentSequence) {
      const response = await fetch(`${apiBase}/chunk/${currentSequence}`, {
        method: "POST",
        headers: { "Content-Type": blob.type || "application/octet-stream" },
        body: blob,
        cache: "no-store",
      });
      if (!response.ok) throw new Error(await responseError(response));
    }

    async function reportError(error) {
      const message = error instanceof Error ? error.message : String(error);
      setStatus(message, "error");
      try { await postJson("error", { message }); } catch (_) {}
    }

    function chooseMimeType() {
      const candidates = [
        "video/webm;codecs=vp9,opus",
        "video/webm;codecs=vp8,opus",
        "video/webm",
      ];
      return candidates.find((value) => MediaRecorder.isTypeSupported(value)) || "";
    }

    function preserveTabPlayback(audioTrack) {
      const settings = audioTrack.getSettings ? audioTrack.getSettings() : {};
      if (!settings.suppressLocalAudioPlayback) return;
      audioContext = new AudioContext();
      const audioStream = new MediaStream([audioTrack]);
      audioContext.createMediaStreamSource(audioStream).connect(audioContext.destination);
    }

    async function beginRecording() {
      if (!stream || recorder) return;
      const mimeType = chooseMimeType();
      recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);

      recorder.addEventListener("dataavailable", (event) => {
        if (!event.data || event.data.size === 0) return;
        const currentSequence = sequence++;
        uploadChain = uploadChain.then(() => postChunk(event.data, currentSequence));
      });

      recorder.addEventListener("stop", async () => {
        try {
          await uploadChain;
          await postJson("complete");
          setStatus("Grabación enviada. Ya puedes cerrar esta ventana.", "success");
        } catch (error) {
          await reportError(error);
        } finally {
          stopTracks();
          window.setTimeout(() => window.close(), 900);
        }
      });

      recorder.start(1000);
      await postJson("started");
      setStatus("Grabando. Vuelve al Grabador de conferencias para finalizar.", "success");
    }

    function stopRecording() {
      if (stopping) return;
      stopping = true;
      if (recorder && recorder.state !== "inactive") {
        recorder.requestData();
        recorder.stop();
      } else {
        stopTracks();
      }
    }

    async function pollCommands() {
      while (!stopping) {
        try {
          const response = await fetch(`${apiBase}/command`, { cache: "no-store" });
          if (!response.ok) throw new Error(await responseError(response));
          const payload = await response.json();
          if (payload.command === "start") await beginRecording();
          if (payload.command === "stop") {
            stopRecording();
            return;
          }
          if (payload.command === "abort") {
            stopping = true;
            stopTracks();
            setStatus("Selección cerrada. Ya puedes cerrar esta ventana.");
            return;
          }
        } catch (error) {
          await reportError(error);
          stopRecording();
          return;
        }
        await new Promise((resolve) => window.setTimeout(resolve, 250));
      }
    }

    async function selectSource() {
      selectButton.disabled = true;
      setStatus("Esperando la selección de Chrome…");
      try {
        stream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            frameRate: { ideal: config.fps },
            displaySurface: modeIsTab ? "browser" : "monitor",
          },
          audio: modeIsTab ? { suppressLocalAudioPlayback: false } : false,
          preferCurrentTab: false,
          selfBrowserSurface: "exclude",
          surfaceSwitching: "exclude",
          systemAudio: "exclude",
        });

        const videoTrack = stream.getVideoTracks()[0];
        const displaySurface = videoTrack?.getSettings?.().displaySurface || "";
        const audioTracks = stream.getAudioTracks();
        const expectedSurface = modeIsTab ? "browser" : "monitor";

        if (displaySurface !== expectedSurface) {
          stopTracks();
          stream = null;
          throw new RetryableSelectionError(modeIsTab
            ? "Debes elegir una pestaña de Chrome, no una pantalla o ventana."
            : "Debes elegir una pantalla completa, no una ventana o pestaña.");
        }
        if (modeIsTab && audioTracks.length === 0) {
          stopTracks();
          stream = null;
          throw new RetryableSelectionError("Activa «Compartir también el audio» y vuelve a seleccionar la pestaña.");
        }

        const mimeType = chooseMimeType();
        await postJson("ready", {
          display_surface: displaySurface,
          has_audio: audioTracks.length > 0,
          mime_type: mimeType,
        });
        if (modeIsTab) preserveTabPlayback(audioTracks[0]);
        videoTrack.addEventListener("ended", async () => {
          if (stopping) return;
          await reportError(new Error("Chrome ha dejado de compartir la fuente."));
          stopRecording();
        }, { once: true });
        selectButton.hidden = true;
        setStatus("Fuente preparada. La grabación comenzará en un momento.");
        await pollCommands();
      } catch (error) {
        if (stream) stopTracks();
        stream = null;
        selectButton.disabled = false;
        if (error instanceof RetryableSelectionError) {
          setStatus(error.message, "error");
        } else if (error instanceof DOMException && error.name === "NotAllowedError") {
          await reportError(new Error("Selección cancelada."));
          stopping = true;
          window.setTimeout(() => window.close(), 700);
        } else {
          await reportError(error);
          stopping = true;
          window.setTimeout(() => window.close(), 700);
        }
      }
    }

    window.addEventListener("beforeunload", () => {
      if (stopping) return;
      const payload = new Blob(
        [JSON.stringify({ message: "Se ha cerrado el selector de Chrome." })],
        { type: "application/json" },
      );
      navigator.sendBeacon(`${apiBase}/error`, payload);
    });
    selectButton.addEventListener("click", selectSource);
  </script>
</body>
</html>
